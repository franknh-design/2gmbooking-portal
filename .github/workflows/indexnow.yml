# v3.19.39 — IndexNow: varsle Bing (og andre IndexNow-søkemotorer) når de
# offentlige sidene endres. Venter til Cloudflare Pages har lagt ut samme
# version.txt som i commiten, og sender så alle URL-ene i sitemap.xml.
# Nøkkelen er offentlig etter IndexNow-protokollen (ligger som /4d8fe2181e00d8c1700b4db0ed54e8af.txt).
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "hjem.html"
      - "rigg-*.html"
      - "overnatting-*.html"
      - "sitemap.xml"
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vent på Cloudflare-deploy
        run: |
          want=$(tr -d '\n' < version.txt)
          for i in $(seq 1 40); do
            live=$(curl -s https://www.2gm.no/version.txt | tr -d '\n')
            [ "$live" = "$want" ] && echo "live: $live" && exit 0
            sleep 10
          done
          echo "Fant ikke $want live innen tidsfristen — sender likevel"
      - name: Send URL-er til IndexNow
        run: |
          urls=$(grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          body=$(printf '{"host":"www.2gm.no","key":"4d8fe2181e00d8c1700b4db0ed54e8af","keyLocation":"https://www.2gm.no/4d8fe2181e00d8c1700b4db0ed54e8af.txt","urlList":%s}' "$urls")
          echo "$body"
          code=$(curl -s -o resp.txt -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' -d "$body" https://api.indexnow.org/indexnow)
          echo "IndexNow svarte $code"; cat resp.txt || true
          case "$code" in 200|202) ;; *) exit 1 ;; esac
